<!DOCTYPE html>
<html>

<head>
    <title>Ramp Tool</title>
    <style>
        body {
            margin: 0;
            display: flex;
            background: #222;
            color: white;
            font-family: Arial;
        }

        .panel {
            width: 320px;
            padding: 10px;
            background: #333;
            overflow: auto;
        }

        .canvasWrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            background: #777;
            border-radius: 10px;
        }

        label {
            margin-top: 10px;
            display: block;
            font-size: 13px;
        }

        input[type=range] {
            width: 100%;
        }

        .debug {
            font-size: 11px;
            color: #aaa;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
        }
    </style>
</head>

<body>

    <div class="panel">

        <h3>Logo A</h3>
        <input type="file" id="fileA">

        <label>X</label><input type="range" id="xA" min="0" max="800" value="150">
        <label>Y</label><input type="range" id="yA" min="0" max="250" value="120">
        <label>Scale</label><input type="range" id="scaleA" min="1" max="100" value="20">
        <label>Rotation</label><input type="range" id="rotA" min="0" max="360" value="0">
        <label>Extrude Height</label><input type="range" id="heightA" min="0.1" max="5" step="0.1" value="0.8">

        <label>Color</label>
        <input type="color" id="colorA" value="#ffffff">

        <select id="filamentA">
            <option value="#ffffff">PLA White</option>
            <option value="#000000">PLA Black</option>
            <option value="#d4af37">PLA Gold</option>
        </select>

        <div class="debug" id="debugA"></div>


        <h3>Logo B</h3>
        <input type="file" id="fileB">

        <label>X</label><input type="range" id="xB" min="0" max="800" value="500">
        <label>Y</label><input type="range" id="yB" min="0" max="250" value="120">
        <label>Scale</label><input type="range" id="scaleB" min="1" max="100" value="20">
        <label>Rotation</label><input type="range" id="rotB" min="0" max="360" value="0">
        <label>Extrude Height</label><input type="range" id="heightB" min="0.1" max="5" step="0.1" value="1.6">

        <label>Color</label>
        <input type="color" id="colorB" value="#cccccc">

        <select id="filamentB">
            <option value="#cccccc">PLA Gray</option>
            <option value="#ff0000">PLA Red</option>
        </select>

        <div class="debug" id="debugB"></div>

        <button onclick="generate()">Generate STL</button>

    </div>

    <div class="canvasWrap">
        <svg id="canvasSVG" width="800" height="250"></svg>
    </div>

    <script>
        const svg = document.getElementById("canvasSVG");

        function loadSVG(file, id) {
            const reader = new FileReader();
            reader.onload = e => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(e.target.result, "image/svg+xml");

                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.innerHTML = doc.documentElement.innerHTML;
                g.id = id;

                svg.appendChild(g);
                update();
            };
            reader.readAsText(file);
        }

        fileA.onchange = () => loadSVG(fileA.files[0], "logoA");
        fileB.onchange = () => loadSVG(fileB.files[0], "logoB");

        filamentA.onchange = () => colorA.value = filamentA.value;
        filamentB.onchange = () => colorB.value = filamentB.value;

        function update() {

            const A = document.getElementById("logoA");
            const B = document.getElementById("logoB");

            if (A) {
                A.setAttribute("transform",
                    `translate(${xA.value},${yA.value})
       scale(${scaleA.value / 20})
       rotate(${rotA.value})`);

                A.setAttribute("fill", colorA.value);
            }

            if (B) {
                B.setAttribute("transform",
                    `translate(${xB.value},${yB.value})
       scale(${scaleB.value / 20})
       rotate(${rotB.value})`);

                B.setAttribute("fill", colorB.value);
            }

            debugA.innerText = `x:${xA.value} y:${yA.value} scale:${scaleA.value} z:${heightA.value}`;
            debugB.innerText = `x:${xB.value} y:${yB.value} scale:${scaleB.value} z:${heightB.value}`;
        }

        document.querySelectorAll("input, select").forEach(el => el.oninput = update);

        function exportSVG() {
            return new XMLSerializer().serializeToString(svg);
        }

        async function generate() {
            const form = new FormData();

            form.append("layout", new Blob([exportSVG()], { type: "image/svg+xml" }), "layout.svg");

            form.append("heightA", heightA.value);
            form.append("heightB", heightB.value);

            form.append("colorA", colorA.value);
            form.append("colorB", colorB.value);

            const res = await fetch("/generate", { method: "POST", body: form });

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "ramp.stl";
            a.click();
        }
    </script>

</body>

</html>
