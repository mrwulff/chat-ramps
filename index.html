<!DOCTYPE html>
<html>

<head>
    <title>Ramp Logo Tool</title>
    <style>
        body {
            margin: 0;
            display: flex;
            font-family: Arial;
            background: #222;
            color: white;
        }

        .panel {
            width: 320px;
            padding: 10px;
            background: #333;
            overflow-y: auto;
        }

        .canvas {
            flex: 1;
            position: relative;
            background: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvasInner {
            position: relative;
            width: 800px;
            height: 250px;
            background: #777;
            border-radius: 10px;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            transform-origin: center center;
            pointer-events: none;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
        }

        input[type=range] {
            width: 100%;
        }

        .debug {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        img {
            max-width: 150px;
        }
    </style>
</head>

<body>

    <div class="panel">

        <h3>Logo A</h3>
        <input type="file" id="fileA">

        <label>X Position</label>
        <input type="range" id="xA" min="0" max="800" value="100">

        <label>Y Position</label>
        <input type="range" id="yA" min="0" max="250" value="100">

        <label>Scale</label>
        <input type="range" id="scaleA" min="1" max="100" value="20">

        <label>Rotation</label>
        <input type="range" id="rotA" min="0" max="360" value="0">

        <label>Z Height</label>
        <input type="range" id="heightA" min="0.1" max="5" step="0.1" value="0.8">

        <div class="debug" id="debugA"></div>


        <h3>Logo B</h3>
        <input type="file" id="fileB">

        <label>X Position</label>
        <input type="range" id="xB" min="0" max="800" value="300">

        <label>Y Position</label>
        <input type="range" id="yB" min="0" max="250" value="100">

        <label>Scale</label>
        <input type="range" id="scaleB" min="1" max="100" value="20">

        <label>Rotation</label>
        <input type="range" id="rotB" min="0" max="360" value="0">

        <label>Z Height</label>
        <input type="range" id="heightB" min="0.1" max="5" step="0.1" value="1.6">

        <div class="debug" id="debugB"></div>

        <button type="button" onclick="generate()">Generate STL</button>

    </div>

    <div class="canvas">
        <div id="canvasInner">

            <!-- LOGO PREVIEWS -->
            <img id="previewA" class="logo">
            <img id="previewB" class="logo">

        </div>
    </div>

    <script>
        const previewA = document.getElementById("previewA");
        const previewB = document.getElementById("previewB");

        // LOAD SVG PREVIEW
        fileA.onchange = () => {
            const f = fileA.files[0];
            if (f) previewA.src = URL.createObjectURL(f);
        };

        fileB.onchange = () => {
            const f = fileB.files[0];
            if (f) previewB.src = URL.createObjectURL(f);
        };


        // UPDATE VISUAL POSITION
        function updatePreview() {

            // A
            previewA.style.left = xA.value + "px";
            previewA.style.top = yA.value + "px";
            previewA.style.transform =
                `translate(-50%, -50%) scale(${scaleA.value / 20}) rotate(${rotA.value}deg)`;

            // B
            previewB.style.left = xB.value + "px";
            previewB.style.top = yB.value + "px";
            previewB.style.transform =
                `translate(-50%, -50%) scale(${scaleB.value / 20}) rotate(${rotB.value}deg)`;

            // DEBUG
            debugA.innerText =
                `UI → x:${xA.value}, y:${yA.value}, scale:${scaleA.value}, z:${heightA.value}`;

            debugB.innerText =
                `UI → x:${xB.value}, y:${yB.value}, scale:${scaleB.value}, z:${heightB.value}`;
        }


        // SLIDER HOOKS
        document.querySelectorAll("input[type=range]").forEach(el => {
            el.oninput = updatePreview;
        });

        updatePreview();


        // SEND TO BACKEND
        async function generate() {

            const formData = new FormData();

            if (fileA.files[0]) formData.append("fileA", fileA.files[0]);
            if (fileB.files[0]) formData.append("fileB", fileB.files[0]);

            // CONVERT UI PIXELS → BLENDER SPACE
            // simple linear mapping (adjust later if needed)
            const scaleFactor = 0.05;

            formData.append("xA", xA.value * scaleFactor);
            formData.append("yA", yA.value * scaleFactor);
            formData.append("scaleA", scaleA.value);
            formData.append("rotA", rotA.value);
            formData.append("heightA", heightA.value);

            formData.append("xB", xB.value * scaleFactor);
            formData.append("yB", yB.value * scaleFactor);
            formData.append("scaleB", scaleB.value);
            formData.append("rotB", rotB.value);
            formData.append("heightB", heightB.value);

            console.log("FORM:", Object.fromEntries(formData));

            const res = await fetch("/generate", {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                console.error("FAILED", await res.text());
                return;
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            // DOWNLOAD FILE
            const a = document.createElement("a");
            a.href = url;
            a.download = "ramp.stl";
            a.click();
        }
    </script>

</body>

</html>
